<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgencyHub v2 — UX/UI Mockup</title>
<style>
:root{
  --bg:#F4F5FA;--card:#FFFFFF;--border:#E6E8F0;--text:#1E2233;--text2:#7A7F8E;
  --primary:#4C5FD5;--primary-light:#EEF1FE;--success:#1E9E5C;--success-light:#E5F6ED;
  --warning:#B8790A;--warning-light:#FCF1DE;--danger:#D6453D;--danger-light:#FBEAE9;
  --muted:#9097A8;--muted-light:#F0F1F5;--purple:#7C3AED;--purple-light:#EDE9FE;
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
.app{max-width:1200px;margin:0 auto;padding:18px 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4C5FD5,#7B8CFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
.logo-text{font-weight:700;font-size:17px;letter-spacing:-0.3px;}
.logo-sub{font-size:11.5px;color:var(--text2);margin-top:-2px;}
.role-switch{display:flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px;}
.role-switch button{border:none;background:transparent;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.role-switch button.active{background:var(--primary);color:#fff;}
.role-switch button:not(.active):hover{color:var(--text);}
.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-bottom:16px;}
.breadcrumb span.sep{color:#C7CAD6;}
.breadcrumb button{border:none;background:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px;font-weight:500;}
.breadcrumb button.current{color:var(--text);font-weight:700;cursor:default;}
.breadcrumb button:not(.current):hover{color:var(--primary);text-decoration:underline;}
h1.page-title{font-size:21px;font-weight:800;letter-spacing:-0.3px;margin-bottom:2px;}
.page-sub{color:var(--text2);font-size:13px;margin-bottom:18px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.card.pad-sm{padding:14px;}
.section-title{font-size:15px;font-weight:800;margin-bottom:10px;letter-spacing:-0.2px;}
.section-title .hint{font-size:12px;color:var(--text2);font-weight:500;margin-left:6px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.stat .label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px;}
.stat .value{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.stat .value small{font-size:13px;font-weight:600;color:var(--text2);}
.pbar{height:8px;border-radius:999px;background:var(--muted-light);overflow:hidden;}
.pbar > div{height:100%;border-radius:999px;}
.pbar-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px;color:var(--text2);font-weight:600;}
.camp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;}
.camp-card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(76,95,213,.10);}
.camp-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.camp-card h3{font-size:15px;font-weight:800;letter-spacing:-0.2px;}
.camp-card .meta{font-size:12px;color:var(--text2);margin-top:2px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.badge.primary{background:var(--primary-light);color:var(--primary);}
.badge.success{background:var(--success-light);color:var(--success);}
.badge.warning{background:var(--warning-light);color:var(--warning);}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.muted{background:var(--muted-light);color:var(--muted);}
.badge.purple{background:var(--purple-light);color:var(--purple);}
.tier-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-muted{opacity:.55;}
.cell-name{font-weight:700;}
.cell-sub{font-size:12px;color:var(--text2);}
a.link{color:var(--primary);text-decoration:none;font-weight:600;}
a.link:hover{text-decoration:underline;}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:#3d4ec2;}
.btn.secondary{background:var(--muted-light);color:var(--text);}
.btn.secondary:hover{background:#E4E6EE;}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);}
.btn.success{background:var(--success);color:#fff;}
.btn.danger-btn{background:var(--danger-light);color:var(--danger);}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn.xs{padding:4px 8px;font-size:11px;border-radius:6px;}
.empty{text-align:center;padding:40px 20px;color:var(--text2);}
.empty .icon{font-size:30px;margin-bottom:10px;}
.empty .title{font-weight:800;color:var(--text);font-size:14px;margin-bottom:4px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tabs button{border:none;background:none;padding:10px 4px;margin-right:18px;font-size:13.5px;font-weight:700;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--text2);}
.field input,.field select{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--primary-light);border-color:var(--primary);}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.note-banner{background:var(--primary-light);color:var(--primary);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
.dup-banner{background:var(--danger-light);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.muted-text{color:var(--text2);font-size:12.5px;}
select.draft-select{font-weight:700;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);}
.channel-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.ch-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--muted-light);color:var(--text2);text-decoration:none;}
.ch-pill.ig{background:#FCE4EC;color:#C2185B;}
.ch-pill.tt{background:#E8F5E9;color:#2E7D32;}
.ch-pill.yt{background:#FFEBEE;color:#C62828;}
.ch-pill.fb{background:#E3F2FD;color:#1565C0;}
.ch-pill.tw{background:#E1F5FE;color:#0277BD;}
.ch-pill.lemon8{background:#FFF8E1;color:#F57F17;}
.bank-chip{display:inline-flex;align-items:center;gap:5px;background:var(--success-light);color:var(--success);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.senior-chip{display:inline-flex;align-items:center;gap:4px;background:var(--purple-light);color:var(--purple);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--card);border-radius:16px;padding:24px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal h2{font-size:17px;font-weight:800;margin-bottom:4px;}
.modal .modal-sub{color:var(--text2);font-size:13px;margin-bottom:18px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.add-brand-card{background:var(--card);border:2px dashed var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text2);font-weight:700;font-size:14px;}
.add-brand-card:hover{border-color:var(--primary);color:var(--primary);}
</style>
</head>

function getBrand(id){return DB.brands.find(b=>b.id===id);}
function getCampaign(bId,cId){return getBrand(bId).campaigns.find(c=>c.id===cId);}
function totalTier(camp,key){return TIERS.reduce((s,t)=>s+camp.tierStats[t][key],0);}
function badge(text,cls){return `<span class="badge ${cls}">${text}</span>`;}
function tierBadge(tier){return `<span class="badge muted" style="background:${TIER_COLOR[tier]}1A;color:${TIER_COLOR[tier]}"><span class="tier-dot" style="background:${TIER_COLOR[tier]}"></span>${tier}</span>`;}
function pbar(v,max,color){const p=max>0?Math.min(100,Math.round(v/max*100)):0;return `<div class="pbar"><div style="width:${p}%;background:${color}"></div></div>`;}
function statusBadge(s){const m=STATUS_MAP[s];return m?badge(m.label,m.cls):'';}
function draftBadge(d){const m=DRAFT_MAP[d];return m?badge(m.label,m.cls):'<span class="muted-text">—</span>';}
function channelPills(channels){
  if(!channels||!channels.length)return '<span class="muted-text" style="font-size:11px;">ไม่มีข้อมูล</span>';
  return `<div class="channel-pills">${channels.map(ch=>`<span class="ch-pill ${CH_CLASS[ch.type]||''}">${CH_ICON[ch.type]||''} ${CH_LABEL[ch.type]||ch.type}</span>`).join('')}</div>`;

function renderOwnerProdTab(camp){

  return `<div class="grid cols-5" style="margin-bottom:16px;">
    ${Object.entries(DRAFT_MAP).map(([k,v])=>`<div class="stat pad-sm"><div class="label">${v.label}</div><div class="value" ${k==='revise'?'style="color:var(--danger)"':k==='posted'?'style="color:var(--success)"':k==='review'?'style="color:var(--warning)"':''}>${counts[k]||0}</div></div>`).join('')}

/* ===== STAFF ===== */
function renderStaffDashboard(){
  const allC=DB.brands.flatMap(b=>b.campaigns.map(c=>({...c,brandId:b.id})));
  const sumF=allC.reduce((s,c)=>s+totalTier(c,'sourced'),0),sumT=allC.reduce((s,c)=>s+c.target,0);
  return `<h1 class="page-title">งานของฉัน</h1><p class="page-sub">เลือกแบรนด์เพื่อดูแคมเปญและบรีฟที่ต้องหาอินฟลู</p>
  <div class="grid cols-3" style="margin-bottom:18px;">
    <div class="stat"><div class="label">แบรนด์ที่ดูแล</div><div class="value">${DB.brands.length}</div></div>
    <div class="stat"><div class="label">แคมเปญทั้งหมด</div><div class="value">${allC.length}</div></div>
    <div class="stat"><div class="label">หาได้แล้ว / เป้ารวม</div><div class="value">${sumF} <small>/ ${sumT}</small></div></div>
  </div>
  <div class="grid cols-2">${DB.brands.map(b=>{
    const found=b.campaigns.reduce((s,c)=>s+totalTier(c,'sourced'),0),target=b.campaigns.reduce((s,c)=>s+c.target,0);
    return `<div class="camp-card" onclick="go({view:'brand',brandId:'${b.id}'})">
      <div class="top"><div><h3>${b.name}</h3><div class="meta">${b.campaigns.length} แคมเปญ / บรีฟ</div></div></div>
      <div class="pbar-row"><span>หาได้แล้ว</span><span>${found} / ${target}</span></div>${pbar(found,target,'#4C5FD5')}
    </div>`;

}
function renderStaffBrand(){
  const brand=getBrand(state.brandId);
  return `<h1 class="page-title">${brand.name}</h1><p class="page-sub">บรีฟ/แคมเปญทั้งหมดของแบรนด์นี้</p>
  <div class="grid cols-2">${brand.campaigns.map(c=>{
    const found=totalTier(c,'sourced');
    return `<div class="camp-card" onclick="go({view:'campaign',campaignId:'${c.id}',tab:'source'})">
      <div class="top"><div><h3>${c.name}</h3><div class="meta">${c.briefFile?'📎 '+c.briefFile:'ยังไม่มีไฟล์บรีฟ'}</div></div>${badge(c.status,'primary')}</div>
      <div class="pbar-row"><span>หาได้แล้ว</span><span>${found} / ${c.target}</span></div>${pbar(found,c.target,'#4C5FD5')}
    </div>`;
  }).join('')}</div>`;
}

  const brand=getBrand(state.brandId),camp=getCampaign(brand.id,state.campaignId);

  <p class="page-sub">${brand.name} · ${camp.status} ${camp.briefFile?`· <a class="link" href="#">📎 ดาวน์โหลดบรีฟ (${camp.briefVersion})</a>`:''}</p>

    <button class="${state.tab==='source'?'active':''}" onclick="go({tab:'source'})">หาอินฟลูเอนเซอร์</button>

}

      <div class="field"><label>วันที่ดีลงานสำเร็จ</label><input type="date"></div>
    </div>
    <div class="section-title" style="font-size:13px;margin-bottom:8px;">ช่องทางลงคลิป <span class="hint">ใส่อย่างน้อย 1 ช่องทาง</span></div>

    <div class="section-title" style="font-size:13px;margin-bottom:8px;">ข้อมูลธนาคารสำหรับจ่ายเงิน <span class="hint">ใส่ตอนดีลเสร็จได้เลย</span></div>
    <div class="grid cols-3" style="margin-bottom:12px;">
      <div class="field"><label>ธนาคาร</label><select><option>-- เลือกธนาคาร --</option><option>ธ.กสิกรไทย</option><option>ธ.กรุงเทพ</option><option>ธ.ไทยพาณิชย์</option><option>ธ.กรุงไทย</option><option>ธ.ทหารไทยธนชาต</option><option>Promptpay</option></select></div>
      <div class="field"><label>เลขบัญชี / Promptpay</label><input type="text" placeholder="0123456789"></div>

    </div>
    <button class="btn primary" onclick="alert('เพิ่มรายชื่อแล้ว — สถานะ: รอหัวหน้าตรวจ')">+ เพิ่มรายชื่อ</button>
  </div>
  <div class="card">
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="section-title" style="margin-bottom:0;">รายชื่อที่ทีมหามาแล้ว (${camp.influencers.length})</div>

    </div>
    <div class="table-wrap"><table>
      <tr><th>ชื่อ / ช่องทาง</th><th>ระดับ</th><th>ผู้ติดตาม</th><th>เพิ่มโดย</th><th>วันดีลงาน</th><th>ธนาคาร</th><th>Senior</th><th>สถานะ</th></tr>
      ${camp.influencers.map(i=>{const isMine=i.addedBy===CURRENT_STAFF;return `<tr class="${isMine?'':'row-muted'}">
        <td><div class="cell-name">${i.name}</div>${channelPills(i.channels)}</td>
        <td>${tierBadge(i.tier)}</td><td class="muted-text">${i.followers}</td>
        <td>${i.addedBy}${isMine?' <span class="cell-sub">(ของฉัน)</span>':''}</td>

      </tr>`;}).join('')}
    </table></div>
    <div class="muted-text" style="margin-top:10px;">* แถวสีจางคือรายชื่อที่เพื่อนในทีมเพิ่ม — ดูได้อย่างเดียว แก้ไขไม่ได้</div>

function renderStaffTrackTab(camp){
  const rows=camp.influencers.filter(i=>i.status==='confirmed');
  if(!rows.length)return emptyState('🚚','ยังไม่มีรายชื่อที่ถูกยืนยัน','เมื่อหัวหน้ายืนยันรายชื่อสุดท้ายจากแบรนด์ รายชื่อจะมาแสดงที่นี่');

        <td><input type="date" value="${i.draft==='posted'?'2026-07-05':''}" style="border:1px solid var(--border);border-radius:8px;padding:6px;font-size:12px;"></td>

        <td><input type="text" placeholder="ลิงก์ Asset (Drive/Dropbox)" value="${i.assetLink||''}" style="border:1px solid var(--border);border-radius:8px;padding:6px;font-size:12px;width:150px;"></td>
        <td>${i.bank?bankChip(i.bank):`<button class="btn xs secondary" onclick="alert('เปิดฟอร์มใส่ข้อมูลธนาคาร')">+ ใส่ธนาคาร</button>`}</td>

    <button class="btn primary" style="margin-top:14px;" onclick="alert('บันทึกการอัปเดตแล้ว')">บันทึกการอัปเดต</button>

}

function showSeniorModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>เพิ่ม Senior Reviewer</h2><div class="modal-sub">Senior จะสามารถช่วยตรวจรายชื่ออินฟลูก่อนส่งถึงหัวหน้า</div>
      <div class="grid cols-2">
        <div class="field"><label>ชื่อพนักงาน</label><input type="text" placeholder="ชื่อ-นามสกุล"></div>
        <div class="field"><label>ตำแหน่ง</label><input type="text" placeholder="เช่น Senior Coordinator"></div>
        <div class="field"><label>อีเมล</label><input type="email" placeholder="staff@agency.com"></div>
        <div class="field"><label>ระดับสิทธิ์</label><select><option>ตรวจรายชื่อ + Approve เบื้องต้น</option><option>ตรวจรายชื่อเท่านั้น (ไม่ Approve)</option></select></div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn primary" onclick="alert('เพิ่ม Senior Reviewer แล้ว ✅');closeModal()">บันทึก</button>
      </div>
    </div>
  </div>`;
}
function closeModal(e){if(!e||e.target.classList.contains('modal-overlay'))document.getElementById('modalRoot').innerHTML='';}

function render(){
  renderRoleSwitch();renderBreadcrumb();
  const el=document.getElementById('content');
  if(state.role==='brand'){if(state.view==='dashboard')el.innerHTML=renderBrandDashboard();else el.innerHTML=renderBrandCampaign();}
  else if(state.role==='owner'){if(state.view==='dashboard')el.innerHTML=renderOwnerDashboard();else if(state.view==='brand')el.innerHTML=renderOwnerBrand();else el.innerHTML=renderOwnerCampaign();}
  else{if(state.view==='dashboard')el.innerHTML=renderStaffDashboard();else if(state.view==='brand')el.innerHTML=renderStaffBrand();else el.innerHTML=renderStaffCampaign();}
}
render();
</script>
